[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remediate"
version = "0.1.0"
description = "ADA/WCAG document remediation: PDF/DOCX in, tagged PDF/UA out."
requires-python = ">=3.11"
dependencies = [
    "weasyprint>=62",
    "pymupdf>=1.24",
    "mammoth>=1.7",
    "python-docx>=1.1",
    "lxml>=5.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pillow>=10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
